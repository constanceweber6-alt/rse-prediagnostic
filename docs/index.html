<style>
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
  .side { position: sticky; top: 84px; }

  .hero-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 40px; align-items: end; }
  .gets { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .gets li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; font-size: 15px; color: var(--ink-2); }
  .gets b { display: block; color: var(--ink); font-size: 16px; }
  .gets .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

  .themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
  .theme-btn {
    text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md);
    padding: 10px 12px; cursor: pointer; display: grid; gap: 6px; font-size: 14px; line-height: 1.25;
  }
  .theme-btn:hover { border-color: var(--pine); }
  .theme-btn[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .theme-btn .count { font-size: 12px; color: var(--muted); }
  .theme-btn .dots { display: flex; gap: 3px; }
  .theme-btn .dots i { width: 10px; height: 10px; border-radius: 3px; background: var(--paper); border: 1px dashed #B9C4BD; }

  .q { padding: 22px 0; border-top: 1px solid var(--line); scroll-margin-top: 90px; }
  .q:first-child { border-top: 0; }
  .q-head { display: flex; gap: 12px; align-items: baseline; }
  .q-id { font-size: 12px; font-weight: 600; color: var(--muted); flex: none; min-width: 38px; }
  .q-text { font-weight: 600; font-size: 17px; line-height: 1.4; }
  .q-help { color: var(--muted); font-size: 14px; margin: 6px 0 14px 50px; }
  .ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-left: 50px; }
  .rung {
    border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 10px 12px 12px;
    cursor: pointer; text-align: left; display: grid; gap: 8px; font-size: 14px; line-height: 1.25; min-height: 76px; align-content: start;
  }
  .rung:hover { border-color: var(--ink-2); }
  .rung .steps { display: flex; gap: 3px; align-items: flex-end; height: 18px; }
  .rung .steps i { width: 6px; border-radius: 2px; background: var(--mist); }
  .rung .steps i:nth-child(1) { height: 6px; }
  .rung .steps i:nth-child(2) { height: 10px; }
  .rung .steps i:nth-child(3) { height: 14px; }
  .rung .steps i:nth-child(4) { height: 18px; }
  .rung[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .rung[aria-pressed="true"][data-v="0"] { background: #FBF3E0; }
  .rung[aria-pressed="true"][data-v="1"] { background: #EEF4ED; }
  .rung[aria-pressed="true"][data-v="2"] { background: #E3EEE7; }
  .rung[aria-pressed="true"][data-v="3"] { background: #DCEAE2; }
  .rung[aria-pressed="true"] .steps i.f { background: var(--pine); }
  .rung[aria-pressed="true"][data-v="0"] .steps i:first-child { background: var(--amber); }
  .q-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 18px; border-top: 1px solid var(--line); }

  .score { display: flex; align-items: flex-end; gap: 10px; }
  .score-num { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: .9; letter-spacing: -0.03em; }
  .score-max { color: var(--muted); font-size: 16px; padding-bottom: 6px; }
  .level-pill { display: inline-block; font-weight: 600; font-size: 14px; padding: 3px 10px; border-radius: 999px; background: var(--ink); color: #fff; margin-top: 10px; }
  .map { margin-top: 22px; display: grid; gap: 10px; }
  .map-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .map-row .name { font-size: 13px; color: var(--ink-2); }
  .map-row .val { font-size: 13px; font-weight: 600; text-align: right; }
  .cells { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .cell { height: 22px; border-radius: 5px; border: 1px dashed #B9C4BD; background: var(--paper); cursor: pointer; padding: 0; }
  .cell:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
  .cell[data-v] { border-style: solid; border-color: transparent; }
  .cell[data-v="0"] { background: var(--m0); }
  .cell[data-v="1"] { background: var(--m1); }
  .cell[data-v="2"] { background: var(--m2); }
  .cell[data-v="3"] { background: var(--m3); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .side-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
  .side-actions .btn-primary { grid-column: 1 / -1; }
  .side-actions .btn-quiet { grid-column: 1 / -1; justify-self: center; }
  details.sheet { margin-top: 10px; font-size: 14px; }
  details.sheet summary { cursor: pointer; color: var(--pine); font-weight: 600; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
  details.sheet summary::-webkit-details-marker { display: none; }
  details.sheet summary::before { content: "+"; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid currentColor; font-size: 13px; line-height: 1; }
  details.sheet[open] summary::before { content: "\2212"; }
  .sheet-body { margin-top: 10px; padding: 14px 16px; background: var(--paper); border-radius: var(--r-md); display: grid; gap: 10px; }
  .sheet-body h4 { margin: 0; font-size: 13px; color: var(--ink-2); }
  .sheet-body ul { margin: 0; padding-left: 18px; }
  .sheet-body p { margin: 0; }

  .verdict { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .verdict p { margin: 0; font-size: 17px; color: var(--ink-2); max-width: 60ch; }
  .verdict .score-num { font-size: 56px; }
  .res-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; padding-top: 22px; }
  .bars { display: grid; gap: 14px; }
  .bar-row .lbl { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
  ul.list { margin: 0; padding-left: 18px; }
  ul.list li { margin-bottom: 6px; }
  .plan-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 28px 0 12px; }
  .plan { list-style: none; margin: 0; padding: 0; counter-reset: plan; }
  .plan > li {
    display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; align-items: start;
    padding: 14px 0; border-top: 1px solid var(--line); counter-increment: plan;
  }
  .plan > li::before { content: counter(plan); font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--pine); line-height: 1.2; }
  .plan > li.done::before { content: ""; }
  .plan .act { font-size: 15px; }
  .plan .meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .empty { color: var(--muted); font-size: 14px; }
  .fine { font-size: 12px; color: var(--muted); margin-top: 18px; }

  @media (max-width: 1000px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; order: -1; }
    .hero-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .grid2, .res-grid { grid-template-columns: 1fr; }
    .themes { grid-template-columns: repeat(2, 1fr); }
    .ladder { grid-template-columns: repeat(2, 1fr); margin-left: 0; }
    .q-help { margin-left: 0; }
    .verdict { grid-template-columns: 1fr; gap: 10px; }
    .plan > li { grid-template-columns: 30px minmax(0, 1fr); gap: 4px 12px; }
    .plan > li > .tag { grid-column: 2; justify-self: start; }
  }
  @media print {
    .layout { display: block; }
    .side, #profile, #questionnaire { display: none !important; }
    .plan > li { break-inside: avoid; }
  }
</style>
</head>

<main class="wrap layout">

    <section class="panel" id="profile" aria-labelledby="hProfile">

          <label class="field-label" for="sector" id="lblSector"></label>

        </div>
        <div>

          <p class="note" id="regionsHelp"></p>
        </div>
      </div>
      <div id="flags" style="display:grid;gap:8px;margin-top:14px"></div>

    <section class="panel" id="questionnaire" aria-labelledby="hQuestions">

      <div id="questions" role="tabpanel"></div>

        <button class="btn btn-quiet" type="button" id="prevTheme"></button>
        <button class="btn btn-secondary" type="button" id="nextTheme"></button>
      </div>
    </section>

    <section class="panel" id="results" aria-labelledby="hResults">
      <div class="print-only">
        <h1 id="printTitle" style="font-family:var(--display);margin:0 0 6px"></h1>
        <p class="sub" id="printMeta"></p>
      </div>
      <div class="panel-head"><h2 id="hResults"></h2></div>
      <div class="verdict">
        <div class="score"><span class="score-num" id="vScore">0</span><span class="score-max">/100</span></div>
        <div>
          <span class="level-pill" id="vLevel" style="margin:0 0 8px"></span>
          <p id="vText"></p>
        </div>
      </div>
      <div class="res-grid">
        <div>
          <h3 id="hThemes"></h3>
          <div class="bars" id="bars"></div>
        </div>
        <div>
          <h3 id="hRegs"></h3>
          <div id="regs"></div>
          <h3 id="hStrengths" style="margin-top:20px"></h3>
          <div id="strengths"></div>
        </div>
      </div>
      <div class="plan-head">
        <h3 id="hPlan" style="margin:0"></h3>
        <div class="chips no-print" id="planFilter" role="group"></div>
      </div>
      <ol class="plan" id="plan"></ol>
      <button class="btn btn-quiet no-print" type="button" id="planMore" hidden></button>
      <p class="fine" id="method"></p>
      <p class="fine" id="disclaimer"></p>
    </section>
  </div>

  <aside class="side" aria-label="Score">
    <div class="panel">
      <div class="sub" id="sideLabel"></div>
      <div class="score"><span class="score-num" id="sScore">0</span><span class="score-max">/100</span></div>
      <span class="level-pill" id="sLevel"></span>
      <div class="map" id="map"></div>
      <div class="legend" id="legend"></div>
      <div class="side-actions">
        <a class="btn btn-primary btn-sm" href="#results" id="sResults"></a>
        <button class="btn btn-secondary btn-sm" type="button" id="sShare"></button>
        <button class="btn btn-secondary btn-sm" type="button" id="sPrint"></button>
        <button class="btn btn-quiet btn-sm" type="button" id="sReset"></button>
      </div>
      <p class="note" id="sideNote"></p>
    </div>
  </aside>
</main>

      sharePrompt: "このリンクをコピーしてください：",
      sharedText: "共有リンクから診断を開きました。変更内容はこの端末にのみ保存されます。",
      sharedClear: "最初からやり直す",
      sharedInvalid: "この共有リンクは不完全か無効です。",
      sheet: "取り組みガイド",
    },
  };
  const ICONS = [
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E5B45" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E5B45" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h6"/></svg>',
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E5B45" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>',
  ];
  const DEMO = { ENV1:2, ENV2:1, ENV3:0, ENV4:1, ENV5:2, SOC1:3, SOC2:2, SOC3:2, SOC4:1, SOC5:0,
                 ETH1:3, ETH2:1, ETH3:2, ETH4:3, ETH5:2, ACH1:2, ACH2:0, ACH3:1, ACH4:0, ACH5:1 };
  const STORE = "csr-prediag-v1", LANG_KEY = "csr-lang", PLAN_LIMIT = 8;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  let D = null;
  let state = { lang: "fr", name: "", sector: "IT", type: "SUB", regions: ["EU"], answers: {}, tab: "ENV" };
  let ui = { planQuick: false, planAll: false };

  function load() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) {}
    if (saved) state = { ...state, ...saved };
    let lang = null;
    try { lang = localStorage.getItem(LANG_KEY); } catch (e) {}
    const nav = (navigator.language || "fr").toLowerCase();
    state.lang = lang || (saved && saved.lang) || (nav.startsWith("fr") ? "fr" : nav.startsWith("ja") ? "ja" : "en");
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); localStorage.setItem(LANG_KEY, state.lang); } catch (e) {}
  }

  // Share link: everything is encoded in the URL, no server involved.
  // Format: #d=1~SECTOR~TYPE~REGIONS~ANSWERS~NAME  (answers: one character per question, "-" if unanswered)
  function shareUrl() {
    const answers = D.questions.map((q) => (state.answers[q.id] ?? "-")).join("");
    const parts = ["1", state.sector, state.type, state.regions.join(","), answers, encodeURIComponent(state.name || "")];
    return location.origin + location.pathname + "#d=" + parts.join("~");
  }
  function readShared() {
    if (!location.hash.startsWith("#d=")) return null;
    const parts = location.hash.slice(3).split("~");
    const [version, sector, type, regions, answers, name] = parts;
    if (version !== "1" || !D.sectors[sector] || !D.entity_types[type] || !answers || answers.length !== D.questions.length) return false;
    const regs = (regions || "").split(",").filter((r) => D.regions[r]);
    const parsed = {};
    D.questions.forEach((q, i) => { const c = answers[i]; if ("0123".includes(c)) parsed[q.id] = Number(c); });
    let decoded = "";
    try { decoded = decodeURIComponent(name || ""); } catch (e) {}
    return { sector, type, regions: regs.length ? regs : ["EU"], answers: parsed, name: decoded.slice(0, 120) };
  }
  let toastTimer;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }
  async function copyShare() {
    const url = shareUrl();
    try { await navigator.clipboard.writeText(url); toast(W("shareCopied")); }
    catch (e) { window.prompt(W("sharePrompt"), url); }
  }

  // Scoring: same rules as scoring.py
  function evaluate() {
    const qs = D.questions, A = state.answers;
    const scores = {};
    for (const p of Object.keys(D.pillars)) {
      const list = qs.filter((q) => q.pillar === p);
      const total = list.reduce((s, q) => s + (A[q.id] ?? 0), 0);
      scores[p] = Math.round(1000 * total / (3 * list.length)) / 10;
    }
    const w = D.sector_weights[state.sector];
    const overall = Math.round(10 * Object.keys(D.pillars).reduce((s, p) => s + scores[p] * w[p], 0)) / 10;
    const level = D.levels.find((l) => overall >= l.threshold).label;
    const intl = state.regions.length >= 3;
    const risk = state.regions.some((r) => D.higher_risk_regions.includes(r));
    const actions = [];
    for (const q of qs) {
      const a = A[q.id] ?? 0, gap = 3 - a;
      if (gap <= 0) continue;
      let p = q.impact * (4 - q.effort) * gap * (q.sector_boost[state.sector] ?? 1);
      if (q.international && intl) p *= D.international_boost;
      if (q.risk_sensitive && risk) p *= D.risk_boost;
      actions.push({ q, a, priority: Math.round(p * 100) / 100, quick: q.effort === 1 && q.impact >= 2 });
    }
    actions.sort((x, y) => y.priority - x.priority);
    const regs = [];
    for (const q of qs) if ((A[q.id] ?? 0) <= 1) for (const r of q.regulations) if (!regs.includes(r)) regs.push(r);
    const strengths = qs.filter((q) => A[q.id] === 3);
    return { scores, overall, level, actions, regs, strengths, intl, risk };
  }

  const T = (k) => D.texts[state.lang][k];
  const W = (k) => WEB[state.lang][k];
  const L = (o) => o[state.lang];
  const pillarKeys = () => Object.keys(D.pillars);

  function renderStatic() {
    document.documentElement.lang = state.lang;
    document.title = W("title");
    document.querySelectorAll(".lang button").forEach((b) => { const on = b.dataset.lang === state.lang; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    $("brandName").textContent = W("brand");
    $("navDiag").textContent = W("navDiag");
    $("navCheck").textContent = W("navCheck");
    $("navGuide").textContent = W("navGuide");
    $("title").textContent = W("title");
    $("tagline").textContent = T("tagline");
    $("ctaStart").textContent = W("start");
    $("ctaDemo").textContent = W("demo");
    $("gets").innerHTML = W("gets").map(([b, txt], i) => `<li><span class="ico" aria-hidden="true">${ICONS[i]}</span><span><b>${esc(b)}</b>${esc(txt)}</span></li>`).join("");
    $("hProfile").textContent = T("step_profile");
    $("lblEntity").textContent = T("entity_name");
    $("entityName").placeholder = T("entity_name_placeholder");
    $("entityName").value = state.name;
    $("lblSector").textContent = T("sector");
    $("lblType").textContent = T("entity_type");
    $("lblRegions").textContent = T("regions");
    $("regionsHelp").textContent = T("regions_help");
    $("sector").innerHTML = Object.entries(D.sectors).map(([k, v]) => `<option value="${k}" ${k === state.sector ? "selected" : ""}>${esc(L(v))}</option>`).join("");
    $("entityType").innerHTML = Object.entries(D.entity_types).map(([k, v]) => `<option value="${k}" ${k === state.type ? "selected" : ""}>${esc(L(v))}</option>`).join("");
    $("hQuestions").textContent = T("step_questions");
    $("hResults").textContent = T("results");
    $("hThemes").textContent = T("by_theme");
    $("hRegs").textContent = T("regulations");
    $("hStrengths").textContent = T("strengths");
    $("hPlan").textContent = T("action_plan");
    $("method").innerHTML = `<b>${esc(T("methodology"))}</b>${W("sep")}${esc(T("methodology_text"))}`;
    $("disclaimer").textContent = T("disclaimer");
    $("sideLabel").textContent = W("sideLabel");
    $("sResults").textContent = W("sideResults");
    $("sPrint").textContent = W("print");
    $("sReset").textContent = W("reset");
    $("sShare").textContent = W("share");
    $("sharedText").textContent = W("sharedText");
    $("sharedClear").textContent = W("sharedClear");
    $("sideNote").textContent = W("sideNote");
    $("prevTheme").textContent = W("prev");
    $("footerText").textContent = W("footer");
    $("printTitle").textContent = T("report_title");
    const colors = ["var(--m0)", "var(--m1)", "var(--m2)", "var(--m3)"];
    $("legend").innerHTML = W("short").map((s, i) => `<span><i style="background:${colors[i]}"></i>${i} ${esc(s)}</span>`).join("") +
      `<span><i style="background:var(--paper);border:1px dashed #B9C4BD"></i>${esc(W("unanswered"))}</span>`;
  }

  function renderRegions() {
    $("regions").innerHTML = Object.entries(D.regions).map(([k, v]) =>
      `<button type="button" class="chip" data-region="${k}" aria-pressed="${state.regions.includes(k)}">${esc(L(v))}</button>`
    ).join("");
  }

  function renderThemes() {
    $("themes").innerHTML = pillarKeys().map((k) => {
      const list = D.questions.filter((q) => q.pillar === k);
      const done = list.filter((q) => state.answers[q.id] !== undefined).length;
      const dots = list.map((q) => {
        const v = state.answers[q.id];
        return v === undefined ? "<i></i>" : `<i style="background:var(--m${v});border-color:transparent;border-style:solid"></i>`;
      }).join("");
      return `<button type="button" role="tab" class="theme-btn" data-tab="${k}" aria-selected="${k === state.tab}"><span>${esc(L(D.pillars[k]))}</span><span class="dots" aria-hidden="true">${dots}</span><span class="count">${done}/${list.length}</span></button>`;
    }).join("");
    const idx = pillarKeys().indexOf(state.tab);
    $("prevTheme").style.visibility = idx === 0 ? "hidden" : "visible";
    $("nextTheme").textContent = idx === pillarKeys().length - 1 ? W("toResults") : W("next");
  }

  function renderQuestions() {
    const list = D.questions.filter((q) => q.pillar === state.tab);
    $("questions").innerHTML = list.map((q) => {
      const cur = state.answers[q.id];
      const rungs = [0, 1, 2, 3].map((v) => {
        const steps = [0, 1, 2, 3].map((s) => `<i class="${s <= v ? "f" : ""}"></i>`).join("");
        return `<button type="button" class="rung" data-q="${q.id}" data-v="${v}" aria-pressed="${cur === v}" title="${esc(D.answer_scale[state.lang][v])}"><span class="steps" aria-hidden="true">${steps}</span><span>${esc(W("short")[v])}</span></button>`;
      }).join("");
      return `<div class="q" id="q-${q.id}"><div class="q-head"><span class="q-id">${q.id}</span><span class="q-text">${esc(L(q.text))}</span></div><p class="q-help">${esc(L(q.help))}</p><div class="ladder" role="group" aria-label="${esc(L(q.text))}">${rungs}</div></div>`;
    }).join("");
  }

  function renderMap(r) {
    $("map").innerHTML = pillarKeys().map((k) => {
      const list = D.questions.filter((q) => q.pillar === k);
      const cells = list.map((q) => {
        const v = state.answers[q.id];
        const label = `${q.id}${W("sep")}${L(q.text)}`;
        return `<button type="button" class="cell" data-goto="${q.id}" ${v === undefined ? "" : `data-v="${v}"`} title="${esc(label)}" aria-label="${esc(label)}"></button>`;
      }).join("");
      return `<div class="map-row"><span class="name">${esc(L(D.pillars[k]))}</span><span class="val">${Math.round(r.scores[k])}</span><div class="cells">${cells}</div></div>`;
    }).join("");
  }

  function sheetHTML(q) {
    return `<details class="sheet"><summary>${esc(W("sheet"))}</summary><div class="sheet-body">
      <div><h4>${esc(T("evidence"))}</h4><ul>${L(q.evidence).map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>
      <div><h4>${esc(T("kpi"))}</h4><p>${esc(L(q.kpi))}</p></div></div></details>`;
  }

  function renderResults() {
    const r = evaluate();
    const answered = Object.keys(state.answers).length, total = D.questions.length;
    $("progressText").textContent = `${answered}/${total} ${T("progress")}`;
    const lvl = L(r.level);
    for (const id of ["sScore", "vScore"]) $(id).textContent = Math.round(r.overall);
    for (const id of ["sLevel", "vLevel"]) $(id).textContent = lvl;
    $("vText").textContent = W("verdict")[lvl] || "";
    renderMap(r);

    const flags = [];
    if (r.intl) flags.push(T("international_flag"));
    if (r.risk) flags.push(T("risk_flag"));
    $("flags").innerHTML = flags.map((f) => `<div class="notice">${esc(f)}</div>`).join("");

    $("bars").innerHTML = pillarKeys().map((k) =>
      `<div class="bar-row"><div class="lbl"><span>${esc(L(D.pillars[k]))}</span><b>${Math.round(r.scores[k])}/100</b></div><div class="meter"><i style="width:${r.scores[k]}%"></i></div></div>`
    ).join("");

    $("regs").innerHTML = r.regs.length
      ? `<ul class="list">${r.regs.map((k) => `<li>${esc(L(D.regulations[k]))}</li>`).join("")}</ul><p class="note">${esc(T("regulations_help"))}</p>`
      : `<p class="empty">${esc(T("no_regulation"))}</p>`;
    $("strengths").innerHTML = r.strengths.length
      ? `<ul class="list">${r.strengths.map((q) => `<li>${esc(L(q.text))}</li>`).join("")}</ul>`
      : `<p class="empty">${esc(T("no_strength"))}</p>`;

    $("planFilter").innerHTML = [[false, W("all")], [true, W("quickOnly")]].map(([v, label]) =>
      `<button type="button" class="chip btn-sm" data-quick="${v}" aria-pressed="${ui.planQuick === v}">${esc(label)}</button>`).join("");
    const list = ui.planQuick ? r.actions.filter((a) => a.quick) : r.actions;
    const shown = ui.planAll ? list : list.slice(0, PLAN_LIMIT);
    $("plan").innerHTML = shown.length
      ? shown.map((a) => `<li><span class="act">${esc(L(a.q.action))}<span class="meta"><span class="tag tag-theme">${esc(L(D.pillars[a.q.pillar]))}</span>${a.q.regulations.length ? `<span class="tag tag-reg">${esc(W("reg"))}</span>` : ""}</span>${sheetHTML(a.q)}</span>${a.quick ? `<span class="tag tag-quick">${esc(T("quick_win"))}</span>` : "<span></span>"}</li>`).join("")
      : `<li class="done" style="grid-template-columns:1fr"><span class="empty">${esc(W("allDone"))}</span></li>`;
    const rest = list.length - PLAN_LIMIT;
    $("planMore").hidden = rest <= 0;
    $("planMore").textContent = ui.planAll ? W("less") : W("more")(rest);

    const name = state.name.trim() || T("unnamed"), sep = W("sep");
    const regions = state.regions.map((k) => L(D.regions[k])).join(W("listSep")) || "-";
    $("printMeta").innerHTML = [
      `<b>${esc(T("report_entity"))}</b>${sep}${esc(name)}`,
      `<b>${esc(T("sector"))}</b>${sep}${esc(L(D.sectors[state.sector]))}`,
      `<b>${esc(T("entity_type"))}</b>${sep}${esc(L(D.entity_types[state.type]))}`,
      `<b>${esc(T("regions"))}</b>${sep}${esc(regions)}`,
      `<b>${esc(T("report_date"))}</b>${sep}${new Date().toLocaleDateString(W("locale"))}`,
    ].join("<br>");
    renderThemes();
  }

  function renderAll() { renderStatic(); renderRegions(); renderQuestions(); renderResults(); }

  function goToQuestion(id) {
    const q = D.questions.find((x) => x.id === id);
    if (!q) return;
    if (state.tab !== q.pillar) { state.tab = q.pillar; save(); renderQuestions(); renderThemes(); }
    const el = $("q-" + id);
    el.scrollIntoView({ block: "center" });
    const first = el.querySelector(".rung"); if (first) first.focus({ preventScroll: true });
  }

  function bind() {
    document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => { state.lang = b.dataset.lang; save(); renderAll(); }));
    $("entityName").addEventListener("input", (e) => { state.name = e.target.value; save(); renderResults(); });
    $("sector").addEventListener("change", (e) => { state.sector = e.target.value; save(); renderResults(); });
    $("entityType").addEventListener("change", (e) => { state.type = e.target.value; save(); renderResults(); });
    $("regions").addEventListener("click", (e) => {
      const b = e.target.closest("[data-region]"); if (!b) return;
      const k = b.dataset.region;
      state.regions = state.regions.includes(k) ? state.regions.filter((r) => r !== k) : [...state.regions, k];
      save(); renderRegions(); renderResults();
    });
    $("themes").addEventListener("click", (e) => {
      const b = e.target.closest("[data-tab]"); if (!b) return;
      state.tab = b.dataset.tab; save(); renderQuestions(); renderThemes();
    });
    $("questions").addEventListener("click", (e) => {
      const b = e.target.closest("[data-q]"); if (!b) return;
      const id = b.dataset.q, v = Number(b.dataset.v);
      if (state.answers[id] === v) delete state.answers[id]; else state.answers[id] = v;
      save();
      b.parentElement.querySelectorAll(".rung").forEach((x) => x.setAttribute("aria-pressed", String(state.answers[id] === Number(x.dataset.v))));
      renderResults();
    });
    const move = (step) => {
      const keys = pillarKeys(), idx = keys.indexOf(state.tab) + step;
      if (idx >= keys.length) { $("results").scrollIntoView(); return; }
      state.tab = keys[Math.max(0, idx)]; save(); renderQuestions(); renderThemes();
      $("questionnaire").scrollIntoView();
    };
    $("prevTheme").addEventListener("click", () => move(-1));
    $("nextTheme").addEventListener("click", () => move(1));
    $("map").addEventListener("click", (e) => { const c = e.target.closest("[data-goto]"); if (c) goToQuestion(c.dataset.goto); });
    $("planFilter").addEventListener("click", (e) => { const b = e.target.closest("[data-quick]"); if (!b) return; ui.planQuick = b.dataset.quick === "true"; ui.planAll = false; renderResults(); });
    $("planMore").addEventListener("click", () => { ui.planAll = !ui.planAll; renderResults(); });
    $("sPrint").addEventListener("click", () => {
      ui.planAll = true; ui.planQuick = false; renderResults();
      document.querySelectorAll("details.sheet").forEach((d) => { d.open = true; });
      window.print();
    });
    $("sShare").addEventListener("click", copyShare);
    $("sharedClear").addEventListener("click", () => { $("sharedBanner").hidden = true; $("sReset").click(); });
    $("ctaDemo").addEventListener("click", () => {
      state = { ...state, answers: { ...DEMO }, sector: "IT", type: "SUB", regions: ["EU", "APAC", "NA"], name: W("demoName") };
      save(); renderAll(); $("results").scrollIntoView();
    });
    $("sReset").addEventListener("click", () => {
      state = { ...state, answers: {}, name: "", regions: ["EU"], tab: "ENV" };
      ui = { planQuick: false, planAll: false };
      save(); renderAll(); $("profile").scrollIntoView();
    });
  }

  load();
  fetch("questionnaire.json")
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((data) => {
      D = data; bind();
      const shared = readShared();
      if (shared) {
        state = { ...state, ...shared, tab: "ENV" };
        save();
        $("sharedBanner").hidden = false;
      }
      renderAll();
      if (shared === false) toast(W("sharedInvalid"));
      if (shared !== null) history.replaceState(null, "", location.pathname + location.search);
      if (shared) $("sharedBanner").scrollIntoView({ block: "center" });
    })
    .catch(() => { document.querySelector("main").innerHTML = `<div class="panel">${esc(WEB[state.lang].loadError)}</div>`; });
})();
</script>
</body>
</html>
