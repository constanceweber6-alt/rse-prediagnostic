<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSR pre-assessment · IT and supply chain</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%231F6F50'/%3E%3C/svg%3E">
<meta name="description" content="Assess the CSR maturity of a subsidiary, a country or a supplier and get a prioritised action plan.">
<style>
  :root {
    --green: #1F6F50;
    --green-dark: #154D38;
    --green-soft: #E8F1EC;
    --ink: #1B2420;
    --muted: #5F6B66;
    --line: #D6E2DB;
    --bg: #F6F8F7;
    --card: #FFFFFF;
    --amber: #B7791F;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
  }
  a { color: var(--green); }
  header.hero {
    background: linear-gradient(135deg, var(--green-dark), var(--green));
    color: #fff;
    padding: 48px 24px 72px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 32px; }
  .brand { font-weight: 700; letter-spacing: .02em; opacity: .9; }
  .lang { display: inline-flex; background: rgba(255,255,255,.15); border-radius: 999px; padding: 3px; }
  .lang button {
    border: 0; background: transparent; color: #fff; padding: 6px 14px; border-radius: 999px;
    cursor: pointer; font: inherit; font-size: 14px;
  }
  .lang button.on { background: #fff; color: var(--green-dark); font-weight: 600; }
  h1 { font-size: clamp(28px, 4vw, 44px); line-height: 1.15; margin: 0 0 12px; max-width: 760px; }
  .tagline { font-size: 18px; max-width: 720px; opacity: .92; margin: 0; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .pill { background: rgba(255,255,255,.14); border-radius: 999px; padding: 4px 12px; font-size: 13px; }

  main.wrap { margin-top: -44px; padding: 0 24px 64px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(21,77,56,.06); padding: 24px; }
  .card + .card { margin-top: 24px; }
  h2 { font-size: 20px; margin: 0 0 16px; }
  h3 { font-size: 16px; margin: 0 0 10px; }
  label.field { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  input[type=text], select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    font: inherit; background: #fff; color: var(--ink);
  }
  input[type=text]:focus, select:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px;
    cursor: pointer; font: inherit; font-size: 14px; color: var(--ink);
  }
  .chip.on { background: var(--green); border-color: var(--green); color: #fff; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .flags { margin-top: 12px; display: grid; gap: 8px; }
  .flag { background: #FFF7E8; border: 1px solid #F1D9A8; color: #6B4A12; border-radius: 10px; padding: 8px 12px; font-size: 14px; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .tab {
    border: 0; background: transparent; padding: 10px 12px; cursor: pointer; font: inherit; font-size: 14px;
    color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab.on { color: var(--green-dark); border-bottom-color: var(--green); font-weight: 600; }
  .tab .count { font-size: 12px; background: var(--green-soft); color: var(--green-dark); border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
  .q { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .q:last-child { border-bottom: 0; }
  .q-text { font-weight: 600; margin-bottom: 4px; }
  .q-help { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .seg button {
    border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 6px; cursor: pointer;
    font: inherit; font-size: 13px; color: var(--ink); text-align: center; line-height: 1.25;
  }
  .seg button b { display: block; font-size: 15px; }
  .seg button:hover { border-color: var(--green); }
  .seg button.on { background: var(--green); border-color: var(--green); color: #fff; }
  details.scale { font-size: 14px; margin-bottom: 8px; }
  details.scale summary { cursor: pointer; color: var(--green-dark); font-weight: 600; }
  details.scale ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); }
  .progress { height: 8px; background: var(--green-soft); border-radius: 999px; overflow: hidden; margin: 6px 0 4px; }
  .progress > div { height: 100%; background: var(--green); width: 0; transition: width .25s; }

  aside { position: sticky; top: 16px; }
  .score-ring { display: flex; align-items: center; gap: 16px; }
  .ring { width: 108px; height: 108px; flex: none; }
  .score-big { font-size: 34px; font-weight: 700; line-height: 1; }
  .level { display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--green-soft); color: var(--green-dark); }
  .bars { margin-top: 18px; display: grid; gap: 10px; }
  .bar-row { font-size: 13px; }
  .bar-row .lbl { display: flex; justify-content: space-between; margin-bottom: 3px; }
  .bar { height: 8px; background: var(--green-soft); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--green); transition: width .25s; }
  .muted { color: var(--muted); font-size: 13px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 10px; padding: 10px 14px;
    cursor: pointer; font: inherit; font-size: 14px; font-weight: 600;
  }
  .btn.primary { background: var(--green); color: #fff; }
  .btn.ghost { background: var(--green-soft); color: var(--green-dark); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

  .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  table.plan { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.plan th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); }
  table.plan td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.plan td.rank { font-weight: 700; color: var(--green-dark); width: 32px; }
  .theme-tag { display: inline-block; font-size: 12px; background: var(--green-soft); color: var(--green-dark); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
  .qw { display: inline-block; font-size: 12px; background: #FFF1D6; color: #7A5212; border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
  ul.clean { margin: 0; padding-left: 18px; }
  ul.clean li { margin-bottom: 4px; }
  .disclaimer { font-size: 12px; color: var(--muted); margin-top: 16px; }
  footer { text-align: center; font-size: 13px; color: var(--muted); padding: 24px; }
  .print-only { display: none; }

  @media (max-width: 960px) {
    main.wrap { grid-template-columns: 1fr; }
    aside { position: static; }
    .results-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .grid2 { grid-template-columns: 1fr; }
    .seg { grid-template-columns: repeat(2, 1fr); }
  }
  @media print {
    body { background: #fff; }
    header.hero, aside, #profileCard, #questionsCard, .btn-row, footer, .no-print { display: none !important; }
    main.wrap { display: block; margin: 0; padding: 0; }
    .card { box-shadow: none; padding: 0; }
    .print-only { display: block; }
    table.plan { font-size: 11px; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">CSR Pre-assessment</div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="fr">FR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <h1 id="title"></h1>
    <p class="tagline" id="tagline"></p>
    <div class="pills" id="pills"></div>
  </div>
</header>

<main class="wrap">
  <div>
    <section class="card" id="profileCard">
      <h2 id="stepProfile"></h2>
      <div class="grid2">
        <div>
          <label class="field" for="entityName" id="lblEntity"></label>
          <input type="text" id="entityName" autocomplete="off">
        </div>
        <div>
          <label class="field" for="sector" id="lblSector"></label>
          <select id="sector"></select>
        </div>
        <div>
          <label class="field" for="entityType" id="lblType"></label>
          <select id="entityType"></select>
        </div>
        <div>
          <span class="field" id="lblRegions" style="display:block;font-size:14px;font-weight:600;margin-bottom:6px"></span>
          <div class="chips" id="regions"></div>
        </div>
      </div>
      <div class="hint" id="regionsHelp"></div>
      <div class="flags" id="flags"></div>
    </section>

    <section class="card" id="questionsCard">
      <h2 id="stepQuestions"></h2>
      <details class="scale"><summary id="scaleTitle"></summary><ul id="scaleList"></ul></details>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="muted" id="progressText"></div>
      <div class="tabs" id="tabs" role="tablist" style="margin-top:16px"></div>
      <div id="questions"></div>
    </section>

    <section class="card" id="resultsCard">
      <div class="print-only">
        <h1 style="color:var(--green);margin:0 0 4px" id="printTitle"></h1>
        <p class="muted" id="printMeta"></p>
      </div>
      <h2 id="stepResults"></h2>
      <div class="results-grid">
        <div>
          <h3 id="radarTitle"></h3>
          <svg id="radar" viewBox="0 0 500 330" width="100%" role="img"></svg>
        </div>
        <div>
          <h3 id="regTitle"></h3>
          <div id="regs"></div>
          <h3 style="margin-top:20px" id="strTitle"></h3>
          <div id="strengths"></div>
        </div>
      </div>
      <h3 style="margin-top:24px" id="planTitle"></h3>
      <div style="overflow-x:auto"><table class="plan" id="plan"></table></div>
      <p class="disclaimer" id="method"></p>
      <p class="disclaimer" id="disclaimer"></p>
    </section>
  </div>

  <aside>
    <div class="card">
      <div class="score-ring">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="50" fill="none" stroke="#E8F1EC" stroke-width="12"/>
          <circle id="ringArc" cx="60" cy="60" r="50" fill="none" stroke="#1F6F50" stroke-width="12"
                  stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="314.16" stroke-dashoffset="314.16"/>
        </svg>
        <div>
          <div class="muted" id="lblOverall"></div>
          <div class="score-big"><span id="overall">0</span><span style="font-size:16px;color:var(--muted)">/100</span></div>
          <span class="level" id="level"></span>
        </div>
      </div>
      <div class="bars" id="bars"></div>
      <div class="btn-row">
        <button class="btn primary" type="button" id="btnPrint"></button>
        <button class="btn ghost" type="button" id="btnDemo"></button>
        <button class="btn ghost" type="button" id="btnReset"></button>
      </div>
      <p class="muted" style="margin-top:14px" id="sideNote"></p>
    </div>
  </aside>
</main>

<footer class="no-print">
  <span id="footerText"></span>
  <a href="https://github.com/constanceweber6-alt/rse-prediagnostic">GitHub</a> ·
  <a href="https://www.linkedin.com/in/constance-weber/">LinkedIn</a>
</footer>

<script>
(() => {
  const WEB = {
    fr: {
      short: ["Rien", "Initié", "Formalisé", "Déployé"],
      print: "Exporter en PDF",
      demo: "Exemple rempli",
      reset: "Effacer",
      sideNote: "Les résultats se mettent à jour à chaque réponse. Les questions sans réponse comptent pour 0.",
      footer: "Projet réalisé par Constance Weber.",
      pills: ["20 questions", "4 thèmes", "Plan d'actions priorisé", "FR / EN"],
      demoName: "Exemple : filiale IT Asie-Pacifique",
      loadError: "Impossible de charger le questionnaire.",
      allDone: "Toutes les pratiques sont déployées et mesurées. Bravo !",
      sep: " : ",
    },
    en: {
      short: ["None", "Started", "Formalised", "Deployed"],
      print: "Export as PDF",
      demo: "Filled example",
      reset: "Clear",
      sideNote: "Results update with every answer. Unanswered questions count as 0.",
      footer: "Project by Constance Weber.",
      pills: ["20 questions", "4 themes", "Prioritised action plan", "FR / EN"],
      demoName: "Example: APAC IT subsidiary",
      loadError: "Could not load the questionnaire.",
      allDone: "Every practice is deployed and measured. Well done!",
      sep: ": ",
    },
  };
  const DEMO = { ENV1:2, ENV2:1, ENV3:0, ENV4:1, ENV5:2, SOC1:3, SOC2:2, SOC3:2, SOC4:1, SOC5:0,
                 ETH1:3, ETH2:1, ETH3:2, ETH4:3, ETH5:2, ACH1:2, ACH2:0, ACH3:1, ACH4:0, ACH5:1 };
  const STORE = "csr-prediag-v1";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  let D = null;
  let state = { lang: "fr", name: "", sector: "IT", type: "SUB", regions: ["EU"], answers: {}, tab: "ENV" };

  function load() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) {}
    if (saved) state = { ...state, ...saved };
    else state.lang = (navigator.language || "fr").toLowerCase().startsWith("fr") ? "fr" : "en";
  }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

  // Scoring, same rules as scoring.py
  function evaluate() {
    const qs = D.questions, A = state.answers;
    const scores = {};
    for (const p of Object.keys(D.pillars)) {
      const list = qs.filter((q) => q.pillar === p);
      const total = list.reduce((s, q) => s + (A[q.id] ?? 0), 0);
      scores[p] = Math.round(1000 * total / (3 * list.length)) / 10;
    }
    const w = D.sector_weights[state.sector];
    const overall = Math.round(10 * Object.keys(D.pillars).reduce((s, p) => s + scores[p] * w[p], 0)) / 10;
    const level = D.levels.find((l) => overall >= l.threshold).label;
    const intl = state.regions.length >= 3;
    const risk = state.regions.some((r) => D.higher_risk_regions.includes(r));
    const actions = [];
    for (const q of qs) {
      const a = A[q.id] ?? 0, gap = 3 - a;
      if (gap <= 0) continue;
      let p = q.impact * (4 - q.effort) * gap * (q.sector_boost[state.sector] ?? 1);
      if (q.international && intl) p *= D.international_boost;
      if (q.risk_sensitive && risk) p *= D.risk_boost;
      actions.push({ q, a, priority: Math.round(p * 100) / 100, quick: q.effort === 1 && q.impact >= 2 });
    }
    actions.sort((x, y) => y.priority - x.priority);
    const regs = [];
    for (const q of qs) if ((A[q.id] ?? 0) <= 1) for (const r of q.regulations) if (!regs.includes(r)) regs.push(r);
    const strengths = qs.filter((q) => A[q.id] === 3);
    return { scores, overall, level, actions, regs, strengths, intl, risk };
  }

  const T = (k) => D.texts[state.lang][k];
  const W = (k) => WEB[state.lang][k];
  const L = (obj) => obj[state.lang];

  function renderStatic() {
    document.documentElement.lang = state.lang;
    document.querySelectorAll(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === state.lang));
    $("title").textContent = T("app_title");
    $("tagline").textContent = T("tagline");
    $("pills").innerHTML = W("pills").map((p) => `<span class="pill">${esc(p)}</span>`).join("");
    $("stepProfile").textContent = T("step_profile");
    $("lblEntity").textContent = T("entity_name");
    $("entityName").placeholder = T("entity_name_placeholder");
    $("entityName").value = state.name;
    $("lblSector").textContent = T("sector");
    $("lblType").textContent = T("entity_type");
    $("lblRegions").textContent = T("regions");
    $("regionsHelp").textContent = T("regions_help");
    $("sector").innerHTML = Object.entries(D.sectors).map(([k, v]) => `<option value="${k}" ${k === state.sector ? "selected" : ""}>${esc(L(v))}</option>`).join("");
    $("entityType").innerHTML = Object.entries(D.entity_types).map(([k, v]) => `<option value="${k}" ${k === state.type ? "selected" : ""}>${esc(L(v))}</option>`).join("");
    $("stepQuestions").textContent = T("step_questions");
    $("scaleTitle").textContent = T("scale_title");
    $("scaleList").innerHTML = Object.entries(D.answer_scale[state.lang]).map(([k, v]) => `<li><b>${k}</b>${W("sep")}${esc(v)}</li>`).join("");
    $("stepResults").textContent = T("results");
    $("radarTitle").textContent = T("radar_title");
    $("regTitle").textContent = T("regulations");
    $("strTitle").textContent = T("strengths");
    $("planTitle").textContent = T("action_plan");
    $("method").innerHTML = `<b>${esc(T("methodology"))}</b>${W("sep")}${esc(T("methodology_text"))}`;
    $("disclaimer").textContent = T("disclaimer");
    $("lblOverall").textContent = T("overall");
    $("btnPrint").textContent = W("print");
    $("btnDemo").textContent = W("demo");
    $("btnReset").textContent = W("reset");
    $("sideNote").textContent = W("sideNote");
    $("footerText").textContent = W("footer") + " ";
    $("printTitle").textContent = T("report_title");
  }

  function renderRegions() {
    $("regions").innerHTML = Object.entries(D.regions).map(([k, v]) =>
      `<button type="button" class="chip ${state.regions.includes(k) ? "on" : ""}" data-region="${k}" aria-pressed="${state.regions.includes(k)}">${esc(L(v))}</button>`
    ).join("");
  }

  function renderTabs() {
    $("tabs").innerHTML = Object.entries(D.pillars).map(([k, v]) => {
      const list = D.questions.filter((q) => q.pillar === k);
      const done = list.filter((q) => state.answers[q.id] !== undefined).length;
      return `<button type="button" role="tab" class="tab ${k === state.tab ? "on" : ""}" data-tab="${k}">${esc(L(v))}<span class="count">${done}/${list.length}</span></button>`;
    }).join("");
  }

  function renderQuestions() {
    const list = D.questions.filter((q) => q.pillar === state.tab);
    $("questions").innerHTML = list.map((q) => {
      const cur = state.answers[q.id];
      const btns = [0, 1, 2, 3].map((v) =>
        `<button type="button" class="${cur === v ? "on" : ""}" data-q="${q.id}" data-v="${v}" title="${esc(D.answer_scale[state.lang][v])}" aria-pressed="${cur === v}"><b>${v}</b>${esc(W("short")[v])}</button>`
      ).join("");
      return `<div class="q"><div class="q-text">${esc(L(q.text))}</div><div class="q-help">${esc(L(q.help))}</div><div class="seg">${btns}</div></div>`;
    }).join("");
  }

  function radarSVG(scores) {
    const keys = Object.keys(D.pillars), cx = 250, cy = 165, R = 100, n = keys.length;
    const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
    let s = "";
    for (const lvl of [25, 50, 75, 100]) {
      s += `<polygon points="${keys.map((_, i) => pt(i, R * lvl / 100).join(",")).join(" ")}" fill="none" stroke="#D6E2DB" stroke-width="1"/>`;
    }
    keys.forEach((_, i) => { const [x, y] = pt(i, R); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#D6E2DB"/>`; });
    const poly = keys.map((k, i) => pt(i, R * scores[k] / 100).join(",")).join(" ");
    s += `<polygon points="${poly}" fill="rgba(31,111,80,.22)" stroke="#1F6F50" stroke-width="2"/>`;
    keys.forEach((k, i) => { const [x, y] = pt(i, R * scores[k] / 100); s += `<circle cx="${x}" cy="${y}" r="3.5" fill="#1F6F50"/>`; });
    keys.forEach((k, i) => {
      const [x, y] = pt(i, R + 22);
      const anchor = Math.abs(x - cx) < 5 ? "middle" : (x > cx ? "start" : "end");
      const lines = [];
      for (const word of L(D.pillars[k]).split(" ")) {
        const last = lines[lines.length - 1];
        if (last && (last + " " + word).length <= 16) lines[lines.length - 1] = last + " " + word;
        else lines.push(word);
      }
      const dy = y < cy ? -(lines.length - 1) * 14 : 0;
      s += `<text x="${x}" y="${y + dy}" text-anchor="${anchor}" font-size="12" fill="#1B2420">` +
        lines.map((ln, j) => `<tspan x="${x}" dy="${j ? 14 : 0}">${esc(ln)}</tspan>`).join("") +
        `<tspan x="${x}" dy="14" font-weight="700" fill="#1F6F50">${Math.round(scores[k])}</tspan></text>`;
    });
    return s;
  }

  function renderResults() {
    const r = evaluate();
    const answered = Object.keys(state.answers).length, total = D.questions.length;
    $("progressBar").style.width = (100 * answered / total) + "%";
    $("progressText").textContent = `${answered}/${total} ${T("progress")}`;

    $("overall").textContent = Math.round(r.overall);
    $("level").textContent = L(r.level);
    $("ringArc").setAttribute("stroke-dashoffset", (314.16 * (1 - r.overall / 100)).toFixed(2));
    $("bars").innerHTML = Object.entries(D.pillars).map(([k, v]) =>
      `<div class="bar-row"><div class="lbl"><span>${esc(L(v))}</span><b>${Math.round(r.scores[k])}</b></div><div class="bar"><div style="width:${r.scores[k]}%"></div></div></div>`
    ).join("");

    const flags = [];
    if (r.intl) flags.push(T("international_flag"));
    if (r.risk) flags.push(T("risk_flag"));
    $("flags").innerHTML = flags.map((f) => `<div class="flag">${esc(f)}</div>`).join("");

    $("radar").innerHTML = radarSVG(r.scores);
    $("radar").setAttribute("aria-label", T("radar_title"));

    $("regs").innerHTML = r.regs.length
      ? `<ul class="clean">${r.regs.map((k) => `<li>${esc(L(D.regulations[k]))}</li>`).join("")}</ul><p class="muted">${esc(T("regulations_help"))}</p>`
      : `<p class="muted">${esc(T("no_regulation"))}</p>`;
    $("strengths").innerHTML = r.strengths.length
      ? `<ul class="clean">${r.strengths.map((q) => `<li>${esc(L(q.text))}</li>`).join("")}</ul>`
      : `<p class="muted">${esc(T("no_strength"))}</p>`;

    $("plan").innerHTML = r.actions.length
      ? `<thead><tr><th>#</th><th>${esc(T("theme"))}</th><th>${esc(T("action"))}</th><th></th></tr></thead><tbody>` +
        r.actions.map((a, i) => `<tr><td class="rank">${i + 1}</td><td><span class="theme-tag">${esc(L(D.pillars[a.q.pillar]))}</span></td><td>${esc(L(a.q.action))}</td><td>${a.quick ? `<span class="qw">${esc(T("quick_win"))}</span>` : ""}</td></tr>`).join("") +
        `</tbody>`
      : `<tbody><tr><td>${esc(W("allDone"))}</td></tr></tbody>`;

    const name = state.name.trim() || T("unnamed");
    const regions = state.regions.map((k) => L(D.regions[k])).join(", ") || "-";
    const sep = W("sep");
    $("printMeta").innerHTML = [
      `<b>${esc(T("report_entity"))}</b>${sep}${esc(name)}`,
      `<b>${esc(T("sector"))}</b>${sep}${esc(L(D.sectors[state.sector]))}`,
      `<b>${esc(T("entity_type"))}</b>${sep}${esc(L(D.entity_types[state.type]))}`,
      `<b>${esc(T("regions"))}</b>${sep}${esc(regions)}`,
      `<b>${esc(T("overall"))}</b>${sep}${Math.round(r.overall)}/100 (${esc(L(r.level))})`,
    ].join("<br>");

    renderTabs();
  }

  function renderAll() { renderStatic(); renderRegions(); renderQuestions(); renderResults(); }

  function bind() {
    document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => { state.lang = b.dataset.lang; save(); renderAll(); }));
    $("entityName").addEventListener("input", (e) => { state.name = e.target.value; save(); renderResults(); });
    $("sector").addEventListener("change", (e) => { state.sector = e.target.value; save(); renderResults(); });
    $("entityType").addEventListener("change", (e) => { state.type = e.target.value; save(); renderResults(); });
    $("regions").addEventListener("click", (e) => {
      const b = e.target.closest("[data-region]"); if (!b) return;
      const k = b.dataset.region;
      state.regions = state.regions.includes(k) ? state.regions.filter((r) => r !== k) : [...state.regions, k];
      save(); renderRegions(); renderResults();
    });
    $("tabs").addEventListener("click", (e) => {
      const b = e.target.closest("[data-tab]"); if (!b) return;
      state.tab = b.dataset.tab; save(); renderQuestions(); renderTabs();
    });
    $("questions").addEventListener("click", (e) => {
      const b = e.target.closest("[data-q]"); if (!b) return;
      const id = b.dataset.q, v = Number(b.dataset.v);
      if (state.answers[id] === v) delete state.answers[id]; else state.answers[id] = v;
      save(); renderQuestions(); renderResults();
    });
    $("btnPrint").addEventListener("click", () => window.print());
    $("btnDemo").addEventListener("click", () => {
      state = { ...state, answers: { ...DEMO }, sector: "IT", type: "SUB", regions: ["EU", "APAC", "NA"], name: W("demoName") };
      save(); renderAll();
    });
    $("btnReset").addEventListener("click", () => {
      state = { ...state, answers: {}, name: "", regions: ["EU"] };
      save(); renderAll();
    });
  }

  load();
  fetch("questionnaire.json")
    .then((r) => r.json())
    .then((data) => { D = data; bind(); renderAll(); })
    .catch(() => { document.querySelector("main").innerHTML = `<div class="card">${esc(WEB[state.lang].loadError)}</div>`; });
})();
</script>
</body>
</html>
