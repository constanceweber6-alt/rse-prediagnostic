<style>
  .section { margin-bottom: 28px; }
  .section > h2 { font-family: var(--display); font-size: 28px; letter-spacing: -0.01em; margin: 0 0 6px; }
  .section > p.sub { margin-bottom: 18px; max-width: 70ch; }

  /* ISO 26000 map */
  .iso { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .iso-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; display: grid; gap: 8px; align-content: start; }
  .iso-card h3 { margin: 0; font-size: 16px; }
  .iso-card p { margin: 0; font-size: 14px; color: var(--ink-2); }
  .cov { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 8px; width: fit-content; }
  .cov::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
  .cov-full { background: #DCEAE2; color: var(--pine-deep); }
  .cov-full::before { background: var(--pine); }
  .cov-partial { background: #EEF4ED; color: var(--ink-2); }
  .cov-partial::before { background: var(--moss); }
  .cov-next { background: var(--amber-soft); color: var(--amber-ink); }
  .cov-next::before { background: var(--amber); }

  /* Steps: a real sequence, so numbered */
  .steps { list-style: none; margin: 0; padding: 0; counter-reset: step; display: grid; gap: 12px; }
  .steps li { counter-increment: step; display: grid; grid-template-columns: 52px 1fr; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px 22px; }
  .steps li::before { content: counter(step); width: 44px; height: 44px; border-radius: 12px; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 20px; }
  .steps h3 { margin: 2px 0 6px; font-size: 18px; }
  .steps p { margin: 0; color: var(--ink-2); max-width: 70ch; }
  .steps .btn { margin-top: 12px; }

  .benefits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .benefit { border-top: 3px solid var(--pine); background: var(--surface); border-radius: 0 0 var(--r-md) var(--r-md); padding: 16px 18px; }
  .benefit h3 { margin: 0 0 6px; font-size: 16px; }
  .benefit p { margin: 0; font-size: 14px; color: var(--ink-2); }

  .resources { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .resources li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; display: grid; gap: 4px; }
  .resources .who { font-size: 13px; color: var(--muted); }
  .resources .what { font-weight: 600; }
  .resources p { margin: 0; font-size: 14px; color: var(--ink-2); }
  .resources a { font-size: 14px; font-weight: 600; width: fit-content; }

  @media (max-width: 900px) { .benefits { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) {
    .benefits { grid-template-columns: 1fr; }
    .steps li { grid-template-columns: 1fr; gap: 10px; }
  }
</style>
